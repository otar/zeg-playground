name: test

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The unit tests, the build tests, the static checks and the size check (REQ-120 to REQ-132)
      - run: npm test
      # The coverage check (REQ-131)
      - run: npm run coverage
